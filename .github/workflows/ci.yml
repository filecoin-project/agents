name: CI

on:
  pull_request:
  # Pull requests can restore caches saved on main, so each push to main
  # saves a fresh Turborepo cache for them.
  push:
    branches: [main]

permissions:
  contents: read

# On main, let every run finish so that each commit saves its cache.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@v3
        with:
          require-lockfile: true

      # actions/cache never overwrites an existing key, so each commit saves
      # under its own key and later runs restore the newest one by prefix.
      - name: Cache Turborepo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.workflow }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Build packages
        run: pnpm build

      - name: Run checks
        run: pnpm check
