name: Release

on:
  push:
    branches: [main]
  # Publishes a package from main without a new release, for a release whose
  # publish failed at a commit that a rerun can't fix.
  workflow_dispatch:
    inputs:
      package:
        description: Package directory to publish from main
        required: true
        type: choice
        options:
          - packages/filecoin-cli
          - packages/filecoin-api-client

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      # Opens or updates the release pull request, and tags and creates the
      # GitHub releases when that pull request merges. Pull requests opened
      # with GITHUB_TOKEN do not trigger CI, so FILOZZY_RELEASE_PLEASE_PAT can
      # hold a token that does.
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.FILOZZY_RELEASE_PLEASE_PAT || github.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  publish:
    name: Publish to npm
    needs: release-please
    # A manual run skips release-please, so the job also runs when its need was
    # skipped. It publishes only from main.
    if: >-
      !cancelled() && (
        needs.release-please.outputs.releases_created == 'true' ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: npm
    permissions:
      contents: read
      # npm trusted publishing exchanges this token for a short-lived publish
      # token and signs the provenance statement.
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@v3
        with:
          require-lockfile: true

      - name: Build and check packages
        run: pnpm turbo run build typecheck test lint --filter='./packages/*'

      # pnpm publish replaces workspace: and catalog: specifiers with versions.
      # A recursive publish skips private packages, so the apps only get a
      # GitHub release, and skips versions already on npm, so a rerun is safe.
      - name: Publish released packages
        env:
          EVENT_NAME: ${{ github.event_name }}
          PACKAGE: ${{ inputs.package }}
          PATHS_RELEASED: ${{ needs.release-please.outputs.paths_released }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            filters=("--filter=./$PACKAGE")
          else
            mapfile -t filters < <(jq -r '.[] | "--filter=./" + .' <<< "$PATHS_RELEASED")
          fi
          pnpm -r "${filters[@]}" publish --provenance --no-git-checks
